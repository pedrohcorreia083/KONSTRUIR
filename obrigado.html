<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Obrigado pelo Contato</title>
  <meta name="description"
    content="Recebemos sua solicitação com sucesso. Em breve nossa equipe entrará em contato." />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- Seu CSS -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- HERO THANK YOU -->
  <section class="hero position-relative overflow-hidden"
    style="min-height:100vh; height:auto; background: var(--navy);">

    <!-- Blueprint Grid -->
    <div class="blueprint-grid">
      <div class="bp-h" style="top:20%"></div>
      <div class="bp-h" style="top:40%"></div>
      <div class="bp-h" style="top:60%"></div>
      <div class="bp-h" style="top:80%"></div>

      <div class="bp-v" style="left:20%"></div>
      <div class="bp-v" style="left:40%"></div>
      <div class="bp-v" style="left:60%"></div>
      <div class="bp-v" style="left:80%"></div>
    </div>

    <div class="container position-relative z-2">

      <div class="row justify-content-center text-center">
        <div class="col-lg-8">

          <!-- Card -->
          <div class="thank-you-card animate-fade-up">

            <div class="thank-you-icon">
              <i class="bi bi-check2"></i>
            </div>

            <span class="section-tag justify-content-center">
              Mensagem Enviada
            </span>

            <h1 class="thank-you-title">
              Obrigado pelo seu contato!
            </h1>

            <p class="thank-you-text">
              Recebemos sua solicitação com sucesso. Nossa equipe irá analisar
              as informações enviadas e retornará o contato o mais breve possível.
            </p>

            <div class="thank-you-info">
              <div class="thank-you-item">
                <i class="bi bi-clock-history"></i>
                Atendimento rápido e especializado
              </div>

              <div class="thank-you-item">
                <i class="bi bi-headset"></i>
                Nossa equipe entrará em contato
              </div>
            </div>

            <div class="d-flex flex-wrap gap-3 justify-content-center mt-4">
              <a href="index.html" class="btn-cta">
                Voltar ao Site
              </a>

              <a href="https://wa.me/5511940237813" class="btn-outline-hero">
                WhatsApp
              </a>
            </div>

          </div>

        </div>
      </div>

    </div>

  </section>

</body>

</html>
